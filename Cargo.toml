[package]
name = "qubeherd"
version = "0.2.0"
edition = "2021"
description = "Push herdr agent state, host clock and keyboard layout to an Ergohaven Qube dongle"
license = "MIT"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt", "signal", "time", "io-util"] }
futures-util = { version = "0.3", default-features = false }
zbus = { version = "5.16", default-features = false, features = ["tokio"] }

[profile.release]
lto = true
strip = true
